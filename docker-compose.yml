version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodejs_practices
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    command: npm run migrate-and-start
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/nodejs_practices
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/usr/src/app

volumes:
  db_data:
